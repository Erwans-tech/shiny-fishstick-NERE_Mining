# 🐳 Blueprint Render Docker pour Néré Mining Laravel
# Documentation : https://render.com/docs/deploy-php-laravel-docker

services:
  - type: web
    name: nere-mining
    plan: starter
    region: oregon
    repo: https://github.com/Erwans-tech/shiny-fishstick-NERE_Mining
    branch: production
    runtime: docker
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Néré Mining"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true # Render générera automatiquement
      - key: APP_URL
        fromService:
          type: web
          name: nere-mining
          property: host
      - key: FORCE_HTTPS
        value: true
      
      # Base de données Supabase (PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.plibklblcykfhnoboqum.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false # À définir dans le dashboard Render avec ton vrai mot de passe
      
      # Session & Cache
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: strict
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      
      # Filesystem
      - key: FILESYSTEM_DISK
        value: public
      
      # Logs
      - key: LOG_CHANNEL
        value: daily
      - key: LOG_LEVEL
        value: warning
      
      # Mail (optionnel)
      - key: MAIL_MAILER
        value: log
      
      # Sécurité
      - key: BCRYPT_ROUNDS
        value: 12