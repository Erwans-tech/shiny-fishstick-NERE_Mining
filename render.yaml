services:
  # ── Web Service (Laravel) ─────────────────────────────────────
  - type: web
    name: nere-mining
    runtime: docker
    repo: https://github.com/Erwans-tech/shiny-fishstick-NERE_Mining
    branch: production-stable
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "Nere Mining"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: nere-mining
          type: web
          property: host
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # PostgreSQL (Render managed database)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nere-mining-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromDatabase:
          name: nere-mining-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nere-mining-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nere-mining-db
          property: password

      # Les médias uploadés sont versionnés dans public/uploads et inclus dans l'image Docker.
      - key: FILESYSTEM_DISK
        value: public

      # HTTPS (Render gère le TLS)
      - key: FORCE_HTTPS
        value: "true"

      # Sessions persistantes dans PostgreSQL; le filesystem Render est éphémère
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # Logs vers stderr (visible dans Render logs)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: nere-mining-db
    databaseName: nere_mining
    user: nere_user
    plan: free
