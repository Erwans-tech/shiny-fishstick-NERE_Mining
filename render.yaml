services:
  # ── Web Service (Laravel) ─────────────────────────────────────
  - type: web
    name: nere-mining
    runtime: docker
    repo: https://github.com/Erwans-tech/shiny-fishstick-NERE_Mining
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    plan: free

    envVars:
      - key: APP_NAME
        value: "Nere Mining"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: nere-mining
          type: web
          property: host
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr

      # PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: nere-mining-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: nere-mining-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nere-mining-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nere-mining-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nere-mining-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nere-mining-db
          property: password

      # Session & cache fichier (pas de Redis en free)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public

      # HTTPS (Render gère le TLS)
      - key: FORCE_HTTPS
        value: "true"

      # Identifiants admin — à renseigner dans Render, jamais dans Git
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Logs vers stderr (visible dans Render logs)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: nere-mining-db
    databaseName: nere_mining
    user: nere_user
    plan: free
