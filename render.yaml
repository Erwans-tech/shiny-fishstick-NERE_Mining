services:
  # ── Web Service (Laravel) ─────────────────────────────────────
  - type: web
    name: nere-mining
    runtime: docker
    repo: https://github.com/Erwans-tech/shiny-fishstick-NERE_Mining
    branch: production
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "Nere Mining"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: nere-mining
          type: web
          property: host
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr

      # PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: nere-mining-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: nere-mining-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nere-mining-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nere-mining-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nere-mining-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nere-mining-db
          property: password

      # Filesystem : Cloudflare R2 en production (gratuit 10GB, compatible S3)
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false          # À renseigner manuellement dans Render > Environment
      - key: R2_SECRET_ACCESS_KEY
        sync: false          # À renseigner manuellement dans Render > Environment
      - key: R2_BUCKET
        sync: false          # Nom du bucket créé dans Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false          # Votre Cloudflare Account ID (32 caractères)
      - key: R2_PUBLIC_URL
        sync: false          # URL publique du bucket (ex: https://pub-xxx.r2.dev ou domaine custom)

      # HTTPS (Render gère le TLS)
      - key: FORCE_HTTPS
        value: "true"

      # Session & cache fichier
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # Logs vers stderr (visible dans Render logs)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: nere-mining-db
    databaseName: nere_mining
    user: nere_user
    plan: free
