services:
  - type: web
    name: nere-mining
    runtime: php
    region: fra
    plan: free
    buildCommand: composer install --no-dev --prefer-dist && php artisan migrate --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nere-mining-db
          property: connectionString
