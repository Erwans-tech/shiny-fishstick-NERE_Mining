services:
  # ── Web Service (Laravel) ─────────────────────────────────────
  - type: web
    name: nere-mining
    runtime: docker
    repo: https://github.com/Erwans-tech/shiny-fishstick-NERE_Mining
    branch: main
    dockerfilePath: ./Dockerfile
    region: oregon
    healthCheckPath: /up
    plan: free

    envVars:
      - key: APP_NAME
        value: "Nere Mining"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: nere-mining
          type: web
          property: host
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr

      # PostgreSQL — base native Render (free tier compatible)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nere-mining-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: nere-mining-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer

      # Session & cache fichier (pas de Redis en free)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public

      # HTTPS (Render gère le TLS)
      - key: FORCE_HTTPS
        value: "true"

      # Identifiants admin — à renseigner dans Render, jamais dans Git
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Logs vers stderr (visible dans Render logs)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

# ── Base de données PostgreSQL native Render (free tier) ────────
databases:
  - name: nere-mining-db
    plan: free
    region: oregon
    databaseName: nere_mining
    user: nere_user
