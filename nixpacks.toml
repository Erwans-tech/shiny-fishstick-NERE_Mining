[phases.setup]
nixPkgs = ["php85", "php85Packages.composer", "nginx", "ffmpeg", "mysql80"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force 2>&1; php artisan storage:link 2>&1; php-fpm -y /etc/php/8.5/fpm/php-fpm.conf & nginx -g 'daemon off;'"
