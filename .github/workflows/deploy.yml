name: Test and deploy to Windows IIS

on:
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Laravel tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, fileinfo, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run deployment-gating tests
        run: >
          php artisan test --no-coverage
          tests/Feature/AdminJobOfferUploadTest.php
          tests/Feature/JobOfferLegacyCompatibilityTest.php
          tests/Feature/SpontaneousApplicationMailTest.php

  deploy:
    name: Deploy to Windows IIS
    runs-on: [self-hosted, windows, nere-iis]
    needs: test
    if: github.ref == 'refs/heads/production-stable'

    steps:
      - name: Check out repository on IIS server
        uses: actions/checkout@v4

      - name: Update IIS site
        shell: powershell
        env:
          IIS_PROJECT_PATH: ${{ vars.IIS_PROJECT_PATH }}
          IIS_APP_POOL_NAME: ${{ vars.IIS_APP_POOL_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IIS_PROJECT_PATH)) {
            throw "Add the IIS_PROJECT_PATH repository variable with the site checkout path."
          }
          .\deploy-production.ps1 `
            -ProjectPath $env:IIS_PROJECT_PATH `
            -AppPoolName $env:IIS_APP_POOL_NAME
